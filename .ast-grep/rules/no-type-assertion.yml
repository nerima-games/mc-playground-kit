id: no-type-assertion
language: TypeScript
# Wave 0 installs at warning; W3-mc-playground-kit removes the assertions and
# raises to error. 70 pre-existing hits as of Wave 0 (11 in src/, across
# fire-lifecycle.ts, chunk-world.ts, status-effect.ts, redstone-network.ts,
# redstone-devices.ts, block-light.ts; 59 in test/) — see the Wave 0 PR report.
severity: warning
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "src/**/*.mts"
  - "src/**/*.cts"
  - "test/**/*.ts"
  - "test/**/*.tsx"
  - "test/**/*.mts"
  - "test/**/*.cts"
  - "vitest.config.ts"
message: >-
  Narrow unknown values with a type guard or construct a validated value;
  do not bypass the type system with a type assertion.
note: >-
  `as const` is the only permitted assertion because it preserves literal
  information without claiming that an unchecked runtime value has another
  type. Runtime boundaries must use a guard or a validated constructor.
rule:
  any:
    - kind: type_assertion
    - kind: non_null_expression
    - all:
        - kind: as_expression
        - not:
            pattern: $VALUE as const
